name: CI

# Temporary diagnostic ref only. Never merge this workflow into the release PR.
on:
  workflow_dispatch:

concurrency:
  group: command-center-layout-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  command-center-layout-diagnostic:
    name: command-center layout attribution (one case)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies with retry
        run: node scripts/npm-retry.mjs ci

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Build server stack
        run: npm run build:server

      - name: Build native app dependency
        run: npm run build --workspace=@getpaseo/expo-two-way-audio

      # Keep the normal browser job's provider discovery environment: late catalog
      # and checkout responses behind the palette are candidate shift sources.
      - name: Install agent CLIs for provider discovery
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run only the failing layout case with attribution
        run: >-
          npm run test:e2e --workspace=@getpaseo/app --
          e2e/browser/command-center-file-search.spec.ts
          --grep "workspace file search stays geometrically stable through delayed loading and results"
          --workers=1 --retries=0 --trace=on
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          E2E_WORKERS: "1"
          E2E_RECORD_VIDEO: "1"

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-center-layout-diagnostic
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7
